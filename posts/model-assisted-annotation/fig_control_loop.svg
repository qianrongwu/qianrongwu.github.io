<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 232" width="780" height="232" role="img" aria-label="Annotation as a control loop: generate, route, correct, audit, with feedback from audit to the earlier stages" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="780" height="232" fill="#fcfcfb"/>
  <g fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2">
    <rect x="20" y="30" width="162" height="92" rx="8"/>
    <rect x="212" y="30" width="162" height="92" rx="8"/>
    <rect x="404" y="30" width="162" height="92" rx="8"/>
    <rect x="596" y="30" width="162" height="92" rx="8"/>
  </g>
  <g fill="#2a78d6">
    <rect x="20" y="30" width="162" height="5" rx="2"/>
    <rect x="212" y="30" width="162" height="5" rx="2"/>
    <rect x="404" y="30" width="162" height="5" rx="2"/>
    <rect x="596" y="30" width="162" height="5" rx="2"/>
  </g>
  <g fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="middle">
    <text x="101" y="64">1 · Generate</text>
    <text x="293" y="64">2 · Route</text>
    <text x="485" y="64">3 · Correct</text>
    <text x="677" y="64">4 · Audit</text>
  </g>
  <g fill="#52514e" font-size="11.5" text-anchor="middle">
    <text x="101" y="87">Who produces the</text><text x="101" y="103">candidate label?</text>
    <text x="293" y="87">Who is allowed to</text><text x="293" y="103">decide this case?</text>
    <text x="485" y="87">How is the combined</text><text x="485" y="103">output made valid?</text>
    <text x="677" y="87">Does the gold set still</text><text x="677" y="103">measure the construct?</text>
  </g>
  <g stroke="#52514e" stroke-width="1.6" fill="none">
    <line x1="184" y1="76" x2="209" y2="76" marker-end="url(#ah)"/>
    <line x1="376" y1="76" x2="401" y2="76" marker-end="url(#ah)"/>
    <line x1="568" y1="76" x2="593" y2="76" marker-end="url(#ah)"/>
    <path d="M677,123 L677,172 L101,172 L101,126" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <path d="M293,172 L293,126" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  </g>
  <text x="389" y="194" fill="#52514e" font-size="11.5" text-anchor="middle">feedback: recalibrate confidence, retrain the annotator, revise the guideline</text>
  <text x="389" y="214" fill="#898781" font-size="11" text-anchor="middle">human labels enter at stages 2–4; model labels enter at stage 1</text>
</svg>
